version: "3.9"

services:
  # ─── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: eval_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evaluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalpassword}
      POSTGRES_DB: ${POSTGRES_DB:-evaldb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evaluser} -d ${POSTGRES_DB:-evaldb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Job Queue) ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eval_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eval_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evaluser}:${POSTGRES_PASSWORD:-evalpassword}@db:5432/${POSTGRES_DB:-evaldb}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # ─── Celery Worker (Async Evaluation Jobs) ────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: eval_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evaluser}:${POSTGRES_PASSWORD:-evalpassword}@db:5432/${POSTGRES_DB:-evaldb}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A workers.tasks worker --loglevel=info --concurrency=4

  # ─── Streamlit Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eval_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
